name: CI

on:
  push:
    branches: [main, feat/jithub-teq-completion, release/**]
  pull_request:
    branches: [main]

# Use the central Ubuntu self-hosted runner per JITHUB engineering policy.
# Never fall back to GitHub-hosted runners without explicit approval.
jobs:
  ci:
    runs-on: [self-hosted, ubuntu, jithub]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate formatting
        run: pnpm exec prettier --check "app/**/*.ts" "app/**/*.tsx" "lib/**/*.ts" "components/**/*.tsx"

      - name: Run ESLint
        run: pnpm exec eslint "app/**" "lib/**" "components/**"

      - name: Run TypeScript checks
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        run: pnpm test

      - name: Validate lockfile consistency
        run: pnpm install --frozen-lockfile

      - name: Validate migrations
        run: pnpm exec drizzle-kit check

      - name: Build the application
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 1
