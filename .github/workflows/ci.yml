name: CI

on:
  push:
    branches: [main, feat/jithub-teq-completion, "release/**"]
  pull_request:
    branches: [main, "release/**"]

# Use the central Ubuntu self-hosted runner per JITHUB engineering policy.
# Never fall back to GitHub-hosted runners without explicit approval.
jobs:
  ci:
    runs-on: [self-hosted, ubuntu, jithub]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate formatting on changed TypeScript files
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          changed_files="$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.ts' '*.tsx')"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files" | xargs -r pnpm exec prettier --check
          else
            echo "No changed TypeScript files to format-check."
          fi

      - name: Run ESLint
        run: pnpm exec eslint "app/**/*.ts" "app/**/*.tsx" "lib/**/*.ts" "components/**/*.tsx"

      - name: Run TypeScript checks
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        run: pnpm test

      - name: Validate lockfile consistency
        run: pnpm install --frozen-lockfile

      - name: Validate migrations
        run: pnpm exec drizzle-kit check

      - name: Build the application
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 1
